name: Direct cohort HTML patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/direct-html-cohort-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Patch source HTML
        run: python scripts/patch_completed_cohort_sections.py

      - name: Commit source HTML fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html infrastructure.html
          git commit -m "Replace stale cohort progress HTML"
          git push origin main
